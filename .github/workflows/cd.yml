name: CD

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # semver stable

permissions:
  contents: write
  packages: write

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

