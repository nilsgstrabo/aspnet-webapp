apiVersion: radix.equinor.com/v1
kind: RadixApplication
metadata:
  name: oauth-demo2
spec:
  environments:
    - name: dev
    - name: prod
  components:
    - name: web
      image: nginxinc/nginx-unprivileged:{imageTagName}
      ports:
        - name: http
          port: 8080
      publicPort: http
    - name: redis
      image: docker.io/library/redis:{imageTagName}
      args:
        - redis-server
        - --save ""
        - --appendonly no
        - --maxmemory 850mb
        - --maxmemory-policy allkeys-lru
        - --lazyfree-lazy-eviction yes
        - --timeout 0
        - --tcp-keepalive 60
        - --requirepass $(REDIS_PASSWORD)
      secrets:
        - REDIS_PASSWORD
      ports:
        - name: redis
          port: 6379
      resources:
        requests:
          memory: 1G
          cpu: 50m
        limits:
          memory: 1G
          cpu: 1000m
      runAsUser: 999
      readOnlyFileSystem: true
      environmentConfig:
        - environment: dev
          imageTagName: "latest"
        - environment: prod
          imageTagName: "8.8.1-alpine3.23"
